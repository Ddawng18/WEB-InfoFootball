; ============================================================
; FastFootBalInfo - file cấu hình mẫu
; Sao chép file này thành config.ini rồi điền key/secret thật.
; KHÔNG commit file config.ini (đã có trong .gitignore).
; ============================================================

[app]
; Đường dẫn gốc ứng dụng (để trống -> tự nhận diện)
base_url = ""
; Múi giờ hiển thị cho người dùng
display_timezone = "Asia/Ho_Chi_Minh"

[db]
host = "127.0.0.1"
port = 3306
name = "fastfootbalinfo"
user = "root"
pass = ""

[api]
; ESPN public scoreboard (không cần API key/tài khoản).
provider = "espn"
espn_base_url = "https://site.api.espn.com/apis/site/v2/sports/soccer"
; Endpoint tổng hợp mọi môn/giải của ESPN cho trận hôm nay (lọc soccer ở client).
espn_guide_url = "https://site.web.api.espn.com/apis/personalized/site/v2/guide/feed?limit=200"
; Slug giải ESPN, phân tách bằng dấu phẩy.
espn_leagues = "eng.1,esp.1,ita.1,ger.1,fra.1,uefa.champions,uefa.wchampions,esp.copa_del_rey,mex.w.1,fifa.friendly.w"
; Nghỉ giữa các request ESPN (ms) để tránh bị rate-limit.
espn_request_delay_ms = 150

[sync]
; TTL (giây) = khoảng cách tối thiểu giữa 2 lần gọi nguồn ngoài.
; Tỉ số/trạng thái trực tiếp: 25 giây, nhỏ hơn chu kỳ AJAX 30 giây để lần hỏi nào
; cũng có thể kích hoạt đồng bộ mới.
ttl_live = 25
; Lịch thi đấu ít thay đổi hơn nên đồng bộ thưa hơn.
ttl_fixtures = 2700
; Danh mục giải/đội đồng bộ mỗi 3 giờ.
ttl_catalog = 10800
; Tin tức (VnExpress) đồng bộ mỗi 30 giây.
ttl_news = 30

[san_pham]
; Sản phẩm lấy từ Tiki.
; File cấu hình nguồn Tiki (không phải scraper).
sources_file = "config/tiki_source.json"
; Khoảng cách tối thiểu (giây) giữa hai lần kiểm tra giá.
ttl = 1800
; Giới hạn số sản phẩm giữ lại sau một lần thu thập.
max_san_pham = 450
; Tổng thời gian tối đa cho một lần thu thập (giây).
max_seconds = 100
; Số trang kết quả tối đa cho mỗi từ khóa/danh mục.
max_trang = 10
; Số trang chi tiết tối đa mở thêm để lấy mô tả/ảnh (0 = không mở).
chi_tiet_toi_da = 30
; Số ngày giữ sản phẩm cũ nếu lần đồng bộ sau không thấy lại.
retention_days = 7
; Thời gian chờ mỗi request (giây).
timeout = 10
; API chi tiết sản phẩm Tiki (bổ sung mô tả/ảnh/shop).
tiki_api_url = "https://api.tiki.vn/v2/products/{id}?platform=web&spid={spid}"
; Để trống = cho phép mọi host HTTPS hợp lệ; hoặc danh sách host cách nhau dấu phẩy.
link_hosts = ""
