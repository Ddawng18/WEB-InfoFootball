; ============================================================
; FastFootBalInfo - file cấu hình mẫu
; Sao chép file này thành config.ini rồi điền key/secret thật.
; KHÔNG commit file config.ini (đã có trong .gitignore).
; ============================================================

[app]
; Đường dẫn gốc ứng dụng (để trống -> tự nhận diện)
base_url = ""
; Múi giờ hiển thị cho người dùng
display_timezone = "Asia/Ho_Chi_Minh"

[db]
host = "127.0.0.1"
port = 3306
name = "fastfootbalinfo"
user = "root"
pass = ""

[api]
; provider:
;   sample      -> đọc dữ liệu mẫu trong sample/ (không cần key, mặc định)
;   apifootball -> API-Football / api-sports.io (header x-apisports-key)
;   livescore   -> Live Score API (key + secret trong query string)
provider = "sample"
base_url = "https://v3.football.api-sports.io/"
; Dán key API-Football vào đây (gói Free: 100 request/ngày)
key = ""
; Live Score API cũ (chỉ dùng khi provider = livescore)
secret = ""
; Mùa dùng cho /leagues. Gói Free API-Football chỉ truy cập 2022-2024.
season = 2023
; Quốc gia lấy giải đấu cho catalog (phân tách bằng dấu phẩy)
countries = "Vietnam,Japan,England"

[sync]
; TTL (giây) = khoảng cách tối thiểu giữa 2 lần gọi nguồn ngoài.
; Thông tin trận đấu (live + lịch) đồng bộ mỗi 45 phút.
ttl_live = 2700
ttl_fixtures = 2700
; Danh mục giải/đội đồng bộ mỗi 3 giờ.
ttl_catalog = 10800
; Tin tức (VnExpress) đồng bộ mỗi 30 giây.
ttl_news = 30
